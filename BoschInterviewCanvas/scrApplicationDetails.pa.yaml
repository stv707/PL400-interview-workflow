Screens:
  scrApplicationDetails:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(198, 0, 0, 1)
    Children:
      - conDetailsPage:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - conDetailsHeader:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(35, 35, 35, 1)
                  Height: =104
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - txtDetailsTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Interview application title"
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Size: =25
                        Text: ="INTERVIEW APPLICATION"
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =28
            - btnDetailsBack:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Return to interview code search"
                  Appearance: =ButtonAppearance.Transparent
                  Color: =RGBA(35, 35, 35, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  Layout: =ButtonLayout.TextOnly
                  OnSelect: =Navigate(Screen1, ScreenTransition.Fade)
                  Text: ="‹  Search another code"
                  Width: =190
                  X: =40
                  Y: =128
            - txtDetailsApplicant:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Applicant name"
                  Color: =RGBA(35, 35, 35, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Size: =30
                  Text: =Coalesce(varApplication.'Applicant Name', "Applicant")
                  Width: =Parent.Width - 96
                  X: =48
                  Y: =188
            - txtDetailsCode:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Interview code"
                  Color: =RGBA(198, 0, 0, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Size: =18
                  Text: |-
                    ="Interview code: " & Coalesce(varApplication.'Interview Code', "")
                  Width: =Parent.Width - 96
                  X: =48
                  Y: =234
            - conDetailsCard:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =360
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Min(900, Parent.Width - 96)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =286
                Children:
                  - txtDetailsEmail:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Applicant email address"
                        Color: =RGBA(50, 50, 50, 1)
                        Font: =Font.'Segoe UI'
                        Size: =16
                        Text: |-
                          ="Email: " & Coalesce(varApplication.'Email Address', "Not provided")
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =30
                  - txtDetailsPhone:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Applicant phone number"
                        Color: =RGBA(50, 50, 50, 1)
                        Font: =Font.'Segoe UI'
                        Size: =16
                        Text: |-
                          ="Phone: " & Coalesce(varApplication.'Phone Number', "Not provided")
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =72
                  - txtDetailsExperience:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Applicant working experience"
                        AutoHeight: =true
                        Color: =RGBA(50, 50, 50, 1)
                        Font: =Font.'Segoe UI'
                        Size: =16
                        Text: |-
                          ="Working experience: " & Coalesce(varApplication.'Working Experience', "Not provided")
                        Width: =Parent.Width - 64
                        Wrap: =true
                        X: =32
                        Y: =114
                  - txtDetailsComments:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Applicant comments"
                        AutoHeight: =true
                        Color: =RGBA(50, 50, 50, 1)
                        Font: =Font.'Segoe UI'
                        Size: =16
                        Text: |-
                          ="Comments: " & Coalesce(varApplication.'Application Comments', "None")
                        Width: =Parent.Width - 64
                        Wrap: =true
                        X: =32
                        Y: =202
                  - txtDetailsStatus:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Application processing status"
                        Color: =RGBA(80, 80, 80, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Size: =15
                        Text: |-
                          ="Status: " & If(IsBlank(varApplication.'Application Status'), "Unknown", Text(varApplication.'Application Status'))
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =292
            - btnOpenDocument:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Open generated Word document"
                  Appearance: =ButtonAppearance.Primary
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  Layout: =ButtonLayout.TextOnly
                  OnSelect: =Launch(varApplication.'Document URL')
                  Text: ="Open Word document"
                  DisplayMode: =If(IsBlank(varApplication.'Document URL'), DisplayMode.Disabled, DisplayMode.Edit)
                  Width: =220
                  X: =48
                  Y: =680
            - btnPrintSummary:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Print applicant summary as PDF"
                  Appearance: =ButtonAppearance.Secondary
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  Layout: =ButtonLayout.TextOnly
                  OnSelect: =Navigate(scrPrintSummary, ScreenTransition.None)
                  Text: ="Print summary PDF"
                  Width: =220
                  X: =284
                  Y: =680
