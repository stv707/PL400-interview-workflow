Screens:
  Screen1:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(198, 0, 0, 1)
      OnVisible: |-
        =Set(varApplication, First('Interview Applications')); Set(varSearchAttempted, false)
    Children:
      - conSearchPage:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - conSearchHeader:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(35, 35, 35, 1)
                  Height: =112
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - txtBrand:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Bosch interview application lookup"
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Size: =26
                        Text: ="BOSCH | INTERVIEW DESK"
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =24
                  - txtHeaderSub:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Internal interviewer workspace"
                        Color: =RGBA(225, 225, 225, 1)
                        Font: =Font.'Segoe UI'
                        Size: =14
                        Text: ="Internal interviewer workspace"
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =68
            - txtPageTitle:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Search title"
                  Color: =RGBA(35, 35, 35, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Size: =30
                  Text: ="Find an interview application"
                  Width: =Parent.Width - 96
                  X: =48
                  Y: =166
            - txtPageHint:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Search instructions"
                  Color: =RGBA(80, 80, 80, 1)
                  Font: =Font.'Segoe UI'
                  Size: =16
                  Text: ="Enter the six-digit reference provided to the applicant."
                  Width: =Parent.Width - 96
                  X: =48
                  Y: =214
            - conSearchCard:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =260
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Min(760, Parent.Width - 96)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =280
                Children:
                  - txtCodeLabel:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Interview code field label"
                        Color: =RGBA(45, 45, 45, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Size: =16
                        Text: ="Interview code"
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =32
                  - txtInterviewCode:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Six-digit interview code"
                        Appearance: =Appearance.Outline
                        BorderColor: =RGBA(120, 120, 120, 1)
                        Default: =""
                        Font: =Font.'Segoe UI'
                        Height: =56
                        MaxLength: =6
                        Placeholder: ="For example, 675838"
                        Size: =22
                        Type: =TextInputType.SingleLine
                        ValidationState: =If(varSearchAttempted && !IsMatch(Trim(Self.Text), "^[0-9]{6}$"), ValidationState.Error, ValidationState.None)
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =70
                  - btnSearch:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Search interview application"
                        Appearance: =ButtonAppearance.Primary
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =52
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: |-
                          =Set(varSearchAttempted, true);
                          If(
                            !IsMatch(Trim(txtInterviewCode.Text), "^[0-9]{6}$"),
                            Notify("Enter a valid six-digit interview code.", NotificationType.Warning),
                            Set(varApplication, LookUp('Interview Applications', 'Interview Code' = Trim(txtInterviewCode.Text)));
                            If(
                              IsBlank(varApplication),
                              Notify("No interview application was found for this code.", NotificationType.Error),
                              Navigate(scrApplicationDetails, ScreenTransition.Fade)
                            )
                          )
                        Text: ="Search application"
                        Width: =220
                        X: =32
                        Y: =166
                  - txtSearchStatus:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Search validation message"
                        Color: =RGBA(180, 0, 0, 1)
                        Font: =Font.'Segoe UI'
                        Size: =13
                        Text: =If(varSearchAttempted && !IsMatch(Trim(txtInterviewCode.Text), "^[0-9]{6}$"), "Use exactly six digits.", "")
                        Visible: =varSearchAttempted && !IsMatch(Trim(txtInterviewCode.Text), "^[0-9]{6}$")
                        Width: =Parent.Width - 280
                        X: =272
                        Y: =184
